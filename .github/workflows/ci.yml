name: CI

# Filet de sécurité minimal : lint + tests unitaires + build sur chaque PR et push main.
# Crucial vu le churn Lovable (déploie main d'un bloc) — empêche une régression d'atteindre
# la prod sans qu'aucun test ne s'exécute. Audit technique transverse 30/06 (LOT C).
#
# IMPORTANT : l'install se fait avec BUN (bun.lock), pas npm. Lovable gère les dépendances
# via bun et ne met PAS à jour package-lock.json -> `npm ci` échouait (lock désync).
# On installe donc avec bun, puis on exécute vite/vitest avec Node (compat maximale).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (bun — aligné avec Lovable)
        run: bun install

      # Lint informatif au départ (dette legacy : ~1054 `as any`). À rendre bloquant
      # une fois la dette de typage résorbée (retirer `continue-on-error`).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Bloquant, contrairement au Lint ci-dessus : cette config ne charge QUE des
      # règles à zéro dette. Aujourd'hui, l'obligation de titre dans les fenêtres
      # Radix (leçon PR #668/#670 : trois modales laissaient les lecteurs d'écran
      # sans rien annoncer, l'avertissement ne se voyait qu'en ouvrant la modale).
      - name: Lint accessibilité (bloquant)
        run: npm run lint:a11y

      # Type-check bloquant : le build Vite ne verifie PAS les types (lecon PR #496 :
      # un identifiant non importe a atteint la prod en ReferenceError). tsc passe a
      # 0 erreur sur main depuis #577 — on verrouille pour que ca le reste.
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      # Code mort : fichiers sans importeur, dépendances déclarées mais jamais
      # utilisées, et l'inverse (utilisées sans être déclarées). La dette du
      # 01/08/2026 est gelée dans knip.jsonc — cette étape bloque ce qui s'y AJOUTE.
      - name: Code mort (knip)
        run: npm run knip

      - name: Unit tests
        run: npm test

      # Les 327 tests des edge functions (Deno) n'étaient JAMAIS exécutés en CI.
      # Pire, en local ils PARAISSAIENT cassés : `deno test` sans drapeaux échoue
      # au chargement sur 7 fichiers (accès env) et sur usage-labels (accès
      # lecture — il relit un source pour comparer deux étiquettes). On a donc
      # cru pendant des semaines à un test rouge sur main : il n'y en avait pas.
      # Les drapeaux vivent maintenant dans `npm run test:edges`, plus dans une
      # ligne de commande à retenir.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests edge functions (Deno)
        run: npm run test:edges

      - name: Build
        run: npm run build
