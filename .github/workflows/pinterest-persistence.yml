name: Pinterest persistence
on:
  pull_request:
    paths: ['src/pages/Pinterest*.tsx', 'src/hooks/use-pinterest-editor.ts', 'supabase/migrations/**', 'supabase/tests/pinterest-persistence.sql', '.github/workflows/pinterest-persistence.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/tests/pinterest-persistence.sql', '.github/workflows/pinterest-persistence.yml']
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pinterest_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Pinterest transactions, scopes, roles and preservation
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d pinterest_test -f supabase/tests/pinterest-persistence.sql
